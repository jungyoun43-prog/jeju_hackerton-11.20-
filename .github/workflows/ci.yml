name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 2026-10-31 공식 GitHub refs API를 insane-search로 확인한 태그의 commit SHA.
      # https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://api.github.com/repos/actions/setup-node/git/ref/tags/v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test workflow, data, server and static hosting
        run: npm test
      - name: Build static demonstration
        run: npm run build
        env:
          APP_REVISION: ${{ github.sha }}
      - name: Build the isolated Lambda ZIP
        run: node scripts/build-agent.mjs
        env:
          APP_REVISION: ${{ github.sha }}
      # https://api.github.com/repos/actions/upload-artifact/git/ref/tags/v7.0.2
      - name: Keep the exact validated build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jeju-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Keep the validated backend separate from public site files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jeju-agent-${{ github.sha }}
          path: output/agent-lambda.zip
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      # Git worktree·개발 브랜치가 없는 runner에서는 개발용 npm run eval을 실행하지 않는다.
